<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – CargoShare</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0F172A 0%, #1E293B 60%, #0F172A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }

    .admin-login-wrap {
      width: 100%;
      max-width: 440px;
    }

    .admin-login-logo {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .admin-login-logo-icon {
      width: 64px;
      height: 64px;
      background: var(--admin-primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto var(--space-4);
    }

    .admin-login-logo h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: white;
      margin-bottom: var(--space-1);
    }

    .admin-login-logo p {
      font-size: 0.85rem;
      color: var(--admin-muted);
    }

    .admin-login-card {
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }

    .admin-login-card label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--admin-muted);
      margin-bottom: var(--space-2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .admin-login-card input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--admin-border);
      border-radius: var(--radius-md);
      background: var(--admin-bg);
      color: var(--admin-text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
      margin-bottom: var(--space-5);
    }

    .admin-login-card input:focus {
      border-color: var(--admin-primary);
      box-shadow: 0 0 0 3px rgba(244,168,32,0.15);
    }

    .admin-login-card input::placeholder { color: var(--admin-muted); }

    .btn-admin-login {
      width: 100%;
      padding: 13px;
      background: var(--admin-primary);
      color: var(--text);
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-admin-login:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .btn-admin-login:disabled { opacity: 0.6; transform: none; }

    .admin-restricted {
      border: 1px solid rgba(244,168,32,0.2);
      background: rgba(244,168,32,0.05);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      text-align: center;
      margin-top: var(--space-5);
      font-size: 0.82rem;
      color: var(--admin-muted);
      font-style: italic;
    }

    .admin-error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      color: #F87171;
      font-size: 0.88rem;
      margin-bottom: var(--space-5);
      display: none;
    }

    .demo-hint-admin {
      background: rgba(244,168,32,0.08);
      border: 1px solid rgba(244,168,32,0.2);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      font-size: 0.82rem;
      color: var(--admin-primary);
      margin-bottom: var(--space-5);
    }

    .back-link {
      display: block;
      text-align: center;
      color: var(--admin-muted);
      font-size: 0.85rem;
      margin-top: var(--space-5);
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--admin-primary); }
  </style>
</head>
<body>

<div class="admin-login-wrap animate-fade-up">
  <div class="admin-login-logo">
    <div class="admin-login-logo-icon">🛡️</div>
    <h1>CargoShare Admin Portal</h1>
    <p>Restricted access – Authorized personnel only</p>
  </div>

  <div class="admin-login-card">
    <div class="demo-hint-admin">
      🔑 <strong>Demo:</strong> admin@cargoshare.in / admin123
    </div>

    <div class="admin-error" id="adminError"></div>

    <form id="adminLoginForm">
      <div>
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="admin@cargoshare.in" required>
      </div>
      <div>
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="Enter admin password" required>
      </div>
      <button type="submit" class="btn-admin-login" id="adminLoginBtn">
        Login as Admin
      </button>
    </form>

    <div class="admin-restricted">
      🔒 Admin accounts are created and managed by the system administrator. No self-registration is available.
    </div>
  </div>

  <a href="login.html" class="back-link">← Back to Login Options</a>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (Auth.isAdmin()) { window.location.href = 'admin/dashboard.html'; return; }

  const form    = document.getElementById('adminLoginForm');
  const errBox  = document.getElementById('adminError');
  const loginBtn= document.getElementById('adminLoginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;

    loginBtn.textContent = 'Verifying…';
    loginBtn.disabled = true;
    errBox.style.display = 'none';

    await new Promise(r => setTimeout(r, 700));

    const result = Auth.adminLogin(email, password);
    if (result.ok) {
      Utils.toast('Admin access granted!', 'success');
      setTimeout(() => window.location.href = 'admin/dashboard.html', 800);
    } else {
      errBox.textContent = '❌ ' + result.msg;
      errBox.style.display = 'block';
      loginBtn.textContent = 'Login as Admin';
      loginBtn.disabled = false;
    }
  });
});
</script>
</body>
</html>
